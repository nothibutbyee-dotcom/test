name: MisakiLarp
options:
  bundleIdPrefix: com.misakilarp
targets:
  MisakiLarp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.misakilarp.app
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: misakilarp
        MARKETING_VERSION: "1.0.0.1 beta 1"
        CURRENT_PROJECT_VERSION: "1"
