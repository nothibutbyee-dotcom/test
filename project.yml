name: MonApp
options:
  bundleIdPrefix: com.moi
targets:
  MonApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes:
          - web
      - path: App/web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moi.monapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MonApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
